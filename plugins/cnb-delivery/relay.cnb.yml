# 用户 CNB 项目的 .cnb.yml 片段：把交付相关事件中继到 agent-autoloop 中台。
# 用法：把这几段合进项目自己的 .cnb.yml（缩进对齐 main: 下）；HUB_TOKEN 建议
# 通过 imports 引用密钥仓库注入，不要硬编码。
#
# 通道选择（实测于 EMQX Cloud Serverless + rich/test/autoloop_cnb 试点）：
# - MQTT 主通道（推荐）：出站 TLS 直连 broker，hub 侧订阅桥收消息转投，
#   无需 hub 公网入口；QoS1 + 桥持久会话，hub 宕机期间 broker 攒批补送。
#   需要 ① broker 凭据（EMQX Cloud「访问控制→客户端认证」建用户）；
#        ② hub 侧跑 plugins/cnb-delivery/mqtt-subscribe.mjs（常驻，见 README）；
#        ③ 把 plugins/cnb-delivery/mqtt-relay.mjs 拷进项目 ops/（零依赖，runner 有 node 即可）。
# - HTTP 兜底：hub 必须有公网地址（devtunnel/公网 IP 等）。MQTT 失败自动回落。
#
# 实测要点：
# - CNB 默认 runner 没有 node：走 MQTT 的流水线要显式指定 pipeline 级
#   `docker: image: node:20-alpine`（与 stages 平级）——stage 级 docker.image 不生效。
# - CNB 没有给出 PR 编号环境变量（CNB_PULL_INDEX 不存在）；编号从 CNB_EVENT_URL
#   末段提取（形如 https://cnb.cool/<repo>/-/pulls/1）。
# - $CNB_COMMIT 在 PR 管道里就是源分支头 sha（不是合并预览 sha）。
# - 无 Accept: application/vnd.cnb.api+json 时 API 一律 406，中继走的是
#   webhook 不受影响，但同管道里调 API 的脚本要带这个头。
#
# 中继 body 字段与 plugins/cnb-delivery/source.ts 的 Relay 类型对应。

main:
  # PR 建立/重开：hub 按 subject（仓库#编号）聚合同一 PR 的事件
  pull_request:
    - docker:
        image: node:20-alpine # MQTT 段需要 node；纯 HTTP 通道可去掉这级 image
      stages:
        - name: relay-to-hub
          env:
            MQTT_HOST: "" # EMQX 连接地址（如 xxx.ala.cn-hangzhou.emqxsl.cn），空则直接走 HTTP
            MQTT_PORT: "8883"
            MQTT_USER: ""
            MQTT_PASS: $MQTT_PASSWORD # imports 密钥注入
            HUB_URL: https://hub.example.com/v1/in/cnbd
            HUB_TOKEN: $AGENT_AUTOLOOP_SECRET_CNBD # 从 imports 注入
          script: |
            NUM="${CNB_EVENT_URL##*/}"
            PAYLOAD="{\"event\":\"pull_request\",\"repo\":\"$CNB_REPO_SLUG\",\"number\":\"$NUM\",\"sha\":\"$CNB_COMMIT\",\"branch\":\"$CNB_BRANCH\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
            if [ -n "$MQTT_HOST" ]; then node ops/mqtt-relay.mjs "$MQTT_HOST" "$MQTT_PORT" "$MQTT_USER" "$MQTT_PASS" "autoloop/cnb/pr" "$PAYLOAD" || true; fi
            curl -fsS -X POST "$HUB_URL" \
              -H "x-cnb-token: $HUB_TOKEN" \
              -H "content-type: application/json" \
              -d "$PAYLOAD" || true
        # 说明：MQTT 成功后 HTTP 仍会重发一次，hub 按 sha 幂等去重，无害。
        # 想省一次调用可用 `MQTT 成功即跳过 HTTP`（mqtt-relay 失败才 curl，见试点仓库 .cnb.yml）。

  # PR 有新提交（synchronize）：通知 hub 更新同一 PR 的状态机
  pull_request.update:
    - docker:
        image: node:20-alpine
      stages:
        - name: relay-to-hub
          env:
            MQTT_HOST: ""
            MQTT_PORT: "8883"
            MQTT_USER: ""
            MQTT_PASS: $MQTT_PASSWORD
            HUB_URL: https://hub.example.com/v1/in/cnbd
            HUB_TOKEN: $AGENT_AUTOLOOP_SECRET_CNBD
          script: |
            NUM="${CNB_EVENT_URL##*/}"
            PAYLOAD="{\"event\":\"pull_request.update\",\"repo\":\"$CNB_REPO_SLUG\",\"number\":\"$NUM\",\"sha\":\"$CNB_COMMIT\",\"branch\":\"$CNB_BRANCH\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
            if [ -n "$MQTT_HOST" ]; then node ops/mqtt-relay.mjs "$MQTT_HOST" "$MQTT_PORT" "$MQTT_USER" "$MQTT_PASS" "autoloop/cnb/pr" "$PAYLOAD" || true; fi
            curl -fsS -X POST "$HUB_URL" \
              -H "x-cnb-token: $HUB_TOKEN" -H "content-type: application/json" \
              -d "$PAYLOAD" || true

  # PR 评论（含 /autoloop 指令）：hub 侧识别 /autoloop 开头的评论当指令（retry/skip-review/rollback），
  # 其余评论忽略。评论者/内容的环境变量名以 CNB 文档为准，先用环境倾倒法实测
  pull_request.comment:
    - docker:
        image: node:20-alpine
      stages:
        - name: relay-to-hub
          env:
            MQTT_HOST: ""
            MQTT_PORT: "8883"
            MQTT_USER: ""
            MQTT_PASS: $MQTT_PASSWORD
            HUB_URL: https://hub.example.com/v1/in/cnbd
            HUB_TOKEN: $AGENT_AUTOLOOP_SECRET_CNBD
          script: |
            curl -fsS -X POST "$HUB_URL" \
              -H "x-cnb-token: $HUB_TOKEN" -H "content-type: application/json" \
              -d "{\"event\":\"pull_request.comment\",\"repo\":\"$CNB_REPO_SLUG\",\"number\":\"${CNB_EVENT_URL##*/}\",\"comment\":$(echo "$CNB_PULL_REQUEST_COMMENT_BODY" | jq -Rs .),\"commenter\":\"$CNB_PULL_REQUEST_COMMENT_AUTHOR\",\"sha\":\"$CNB_COMMIT\",\"url\":\"$CNB_EVENT_URL\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

  # 合并进 main：通知 hub 进入「等发布、核实线上」阶段
  push:
    - branch-filter: [main]
      docker:
        image: node:20-alpine
      stages:
        - name: relay-to-hub
          env:
            MQTT_HOST: ""
            MQTT_PORT: "8883"
            MQTT_USER: ""
            MQTT_PASS: $MQTT_PASSWORD
            HUB_URL: https://hub.example.com/v1/in/cnbd
            HUB_TOKEN: $AGENT_AUTOLOOP_SECRET_CNBD
          script: |
            PAYLOAD="{\"event\":\"push\",\"repo\":\"$CNB_REPO_SLUG\",\"sha\":\"$CNB_COMMIT\",\"branch\":\"main\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
            if [ -n "$MQTT_HOST" ]; then node ops/mqtt-relay.mjs "$MQTT_HOST" "$MQTT_PORT" "$MQTT_USER" "$MQTT_PASS" "autoloop/cnb/push" "$PAYLOAD" || true; fi
            curl -fsS -X POST "$HUB_URL" \
              -H "x-cnb-token: $HUB_TOKEN" -H "content-type: application/json" \
              -d "$PAYLOAD"

  # 部署流水线（示例）：真正的构建发布在这里做，hub 靠 build/logs + 健康接口核实
  # api_trigger_deploy:
  #   - stages:
  #       - name: deploy
  #         script: ./deploy.sh

# NPC 自动修复流水线：审查事件名尾部 review 换 fix 即是修复事件（api_trigger_deliver_review →
# api_trigger_deliver_fix），项目不配这段则 request_changes 照旧退回人工。中台以 npc.workMode=true
# 派单（token 提权可写可推），env 的 DELIVERY_USER_PROMPT 带问题清单与推送要求；
# NPC 修完 push 回源分支，新 head 触发重审，轮数由 ops/delivery.json 的 review.fixRounds 封顶。
$:
  api_trigger_deliver_fix:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: NPC 自动修复
          type: npc:go
          options:
            systemPrompt: >-
              你是该仓库的开发工程师。严格按用户提示词执行：直接修改代码修复列出的问题，
              改动保持最小、聚焦，不动无关文件；完成后把改动推回指定的源分支，
              并按要求在原 PR 下评论修复说明。某条问题经核实不成立的，说明理由后跳过。
            userPrompt: ${DELIVERY_USER_PROMPT}

# NPC 审查流水线：挂 $ 通配 key（分支 key 只匹配同名分支；startBuild 的 branch 传 PR 源分支）。
# 中台以 api_trigger_deliver_review + npc.name=CodeBuddy 派单，env 带 DELIVERY_USER_PROMPT；npc:go 的 userPrompt 必填。
# 需 worker 环境变量 CNB_NPC_EVENT=api_trigger_deliver_review 激活派单路线。
$:
  api_trigger_deliver_review:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: NPC 代码审查
          type: npc:go
          options:
            systemPrompt: >-
              你是仓库的代码审查员。严格按用户提示词执行：审查指定 PR 的改动，并按提示词要求的
              标记格式提交评审。没有阻塞性问题就发 approve；只有会导致事故的问题才发 request_changes。
            userPrompt: ${DELIVERY_USER_PROMPT}
  api_trigger_deliver_build:
    # NPC 开发派单：PR 里评论 /autoloop build <需求>，中台召唤工作模式的 CodeBuddy 从零实现——
    # 新建分支、写代码、自己开 PR；PR 开出后 pull_request 中继接管（NPC 作者自动补交付标），
    # 审查-合并-发布照常走。开发人设与修复人设分开写：这里按需求实现，不做审查也不合并。
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: NPC 开发派单
          type: npc:go
          options:
            systemPrompt: >-
              你是该仓库的开发工程师。严格按用户提示词执行：从 main 新建开发分支，
              按需求实现改动（最小聚焦，只动相关文件），提交推送，然后向 main 开 Pull Request，
              描述写清需求到实现的对应关系。不要合并 PR——审查与合并由交付中台接管。
            userPrompt: ${DELIVERY_USER_PROMPT}
  api_trigger_deliver_cross:
    # 交叉复核：首轮审查结论（approve/打回）回来后，中台自动派第二只眼——打回后核实每条 findings
    # 是否成立（verify），approve 后换找岔人设挑漏（challenge）；两轮一致自动定夺，分歧标人工仲裁。
    # 也可在 PR 里评论 /autoloop cross-review 手动触发。复核模式由 userPrompt 区分。
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: NPC 交叉复核
          type: npc:go
          options:
            systemPrompt: >-
              你是仓库的交叉复核员。严格按用户提示词执行：核实或独立复查指定 PR 的改动，
              并按提示词要求的标记格式（交叉复核）提交评审。只看事实与依据，不迎合任何一方的结论。
            userPrompt: ${DELIVERY_USER_PROMPT}
